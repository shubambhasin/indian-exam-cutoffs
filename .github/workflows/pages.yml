name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; let a queued run supersede an older one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The same gate Vercel uses as its build command: a malformed dataset
      # fails here rather than shipping a broken page.
      - name: Validate the dataset
        run: node scripts/validate.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
